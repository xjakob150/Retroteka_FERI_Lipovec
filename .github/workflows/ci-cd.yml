
name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "ruff>=0.11,<1.0"

      - name: Run Ruff
        working-directory: backend
        run: ruff check . --select E4,E7,E9,F

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Package backend
        run: |
          tar -czf backend-source.tar.gz \
            --exclude='.ruff_cache' \
            --exclude='__pycache__' \
            -C backend .

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend-source.tar.gz
          retention-days: 7

      - name: Build backend Docker image
        run: |
          docker build \
            -t retroteka-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" \
            -t retroteka-frontend:${{ github.sha }} \
            ./frontend

      - name: Save Docker images
        run: |
          docker save \
            retroteka-backend:${{ github.sha }} \
            retroteka-frontend:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images.tar
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: retroteka
          POSTGRES_USER: retroteka
          POSTGRES_PASSWORD: retroteka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retroteka -d retroteka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      POSTGRES_DB: retroteka
      POSTGRES_USER: retroteka
      POSTGRES_PASSWORD: retroteka
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          pytest --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      # Frontend tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: ./docker-images

      - name: Load Docker images
        run: docker load -i ./docker-images/docker-images.tar

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag and push Docker images
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag retroteka-backend:${{ github.sha }} \
            "$IMAGE_PREFIX/backend:${{ github.sha }}"

          docker tag retroteka-frontend:${{ github.sha }} \
            "$IMAGE_PREFIX/frontend:${{ github.sha }}"

          docker push "$IMAGE_PREFIX/backend:${{ github.sha }}"
          docker push "$IMAGE_PREFIX/frontend:${{ github.sha }}"

      - name: Trigger Render backend deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || {
            echo "Missing RENDER_BACKEND_DEPLOY_HOOK secret"
            exit 1
          }

          IMAGE_URL="ghcr.io/${GITHUB_REPOSITORY,,}/backend:${GITHUB_SHA}"

          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK"

      - name: Trigger Render frontend deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || {
            echo "Missing RENDER_FRONTEND_DEPLOY_HOOK secret"
            exit 1
          }

          IMAGE_URL="ghcr.io/${GITHUB_REPOSITORY,,}/frontend:${GITHUB_SHA}"

          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK"
